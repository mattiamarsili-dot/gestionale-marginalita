services:
  - type: web
    name: gestionale-marginalita
    env: python
    pythonVersion: "3.11.9"
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_CODE
        sync: false           # legacy: usato solo finché non esiste alcun utente
      - key: ADMIN_EMAIL
        sync: false           # email del primo admin (creato al primo avvio)
      - key: ADMIN_PASSWORD
        sync: false           # password del primo admin
      - key: ADMIN_NOME
        sync: false           # nome del primo admin (opzionale)
      - key: DATABASE_URL
        sync: false           # copiare da neon.tech
      - key: DRIVE_FOLDER_ID
        sync: false           # ID cartella Google Drive
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false           # contenuto JSON service account (tutto su una riga)
