{% extends "base.html" %}
{% block title %}Modifica rinnovo — Gestionale{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-7 col-lg-6">
    <div class="d-flex align-items-center mb-4 gap-3">
      <a href="{{ url_for('rinnovi_lista') }}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i></a>
      <h4 class="fw-bold mb-0">Modifica rinnovo</h4>
    </div>

    <form method="post" action="{{ url_for('rinnovo_modifica', rinnovo_id=r.id) }}">
      <div class="card"><div class="card-body">
        <div class="mb-3">
          <label class="form-label small text-muted">Paziente</label>
          <div class="fw-semibold">{{ (r.cognome ~ ' ' ~ r.nome)|trim or '—' }}</div>
        </div>
        <div class="mb-3">
          <label class="form-label small">Tipologia / ausilio fornito</label>
          <input type="text" name="tipologia" class="form-control form-control-sm" list="lista-tipologie-rin" value="{{ r.tipologia or '' }}">
          <datalist id="lista-tipologie-rin">
            {% for t in tipologie %}<option value="{{ t }}">{% endfor %}
          </datalist>
        </div>
        <div class="mb-3">
          <label class="form-label small">Ausilio (descrizione)</label>
          <input type="text" name="ausilio" class="form-control form-control-sm" value="{{ r.ausilio or '' }}">
        </div>
        <div class="mb-3">
          <label class="form-label small">Categoria di rinnovo</label>
          <select name="categoria" class="form-select form-select-sm">
            <option value="auto">Automatica (dalla tipologia)</option>
            {% for k, label in categorie.items() %}
            <option value="{{ k }}" {% if r.categoria == k %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="row g-2">
          <div class="col-7">
            <label class="form-label small">Data pratica (mese)</label>
            <input type="month" name="data_pratica" class="form-control form-control-sm" value="{{ r.data_pratica_mese }}">
          </div>
          <div class="col-5">
            <label class="form-label small">Mesi rinnovo</label>
            <input type="number" name="mesi_rinnovo" class="form-control form-control-sm" min="1" placeholder="auto" value="{{ r.mesi_rinnovo or '' }}">
          </div>
        </div>
        <div class="mt-3">
          <label class="form-label small">Note</label>
          <input type="text" name="note" class="form-control form-control-sm" value="{{ r.note or '' }}">
        </div>
      </div></div>
      <div class="d-flex justify-content-end gap-2 mt-3">
        <a href="{{ url_for('rinnovi_lista') }}" class="btn btn-outline-secondary">Annulla</a>
        <button type="submit" class="btn btn-primary px-4"><i class="bi bi-save-fill me-1"></i>Salva</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
